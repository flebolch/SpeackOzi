<!-- mailToButton.html -->
<div x-data="{
    mailText: '',
    mailNotification: false,
    sendMail() {
        const mailTo = this.mailText;
        const subject = encodeURIComponent('Assistance - Réinitialisation Mot de Passe');
        const body = encodeURIComponent(document.getElementById($el.closest('[data-element-id]').getAttribute('data-element-id')).innerText);
        
        window.location.href = `mailto:${mailTo}?subject=${subject}&body=${body}`;
        
        this.mailNotification = true;
        let that = this;
        setTimeout(function(){
            that.mailNotification = false;
        }, 3000);
    }
}" class="relative z-20 flex items-center">
    
    <div x-show="mailNotification" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-2" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 translate-x-2" class="absolute left-0" x-cloak>
        <div class="px-3 h-7 -ml-1.5 items-center flex text-xs bg-blue-500 border-r border-blue-500 -translate-x-full text-white rounded">
            <span>Mail créé</span>
            <div class="absolute right-0 inline-block h-full -mt-px overflow-hidden translate-x-3 -translate-y-2 top-1/2">
                <div class="w-3 h-3 origin-top-left transform rotate-45 bg-blue-500 border border-transparent"></div>
            </div>
        </div>
    </div>
    
    <button @click="mailText = $store.signature.owner || 'user@example.com'; sendMail();"  
        class="flex items-center justify-center h-6 text-xs bg-white border rounded-md cursor-pointer w-6 border-neutral-200/60 hover:bg-neutral-100 active:bg-white focus:bg-white focus:outline-none text-neutral-500 hover:text-neutral-600 group">
        <svg fill="none" height="27" viewBox="0 0 34 27" width="34" xmlns="http://www.w3.org/2000/svg">
            <path d="M28.5 25.6H5.5C3.4 25.6 1.70001 23.8929 1.70001 21.7841V5.41592C1.70001 3.30714 3.4 1.59998 5.5 1.59998H28.5C30.6 1.59998 32.3 3.30714 32.3 5.41592V21.7841C32.4 23.8929 30.6 25.6 28.5 25.6Z" stroke="#4F4F4F" stroke-linecap="round" stroke-miterlimit="10" stroke-width="2"/>
            <path d="M17 14.9557L2.60001 3.60834" stroke="#4F4F4F" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
            <path d="M31.4 3.60834L17 14.9557" stroke="#4F4F4F" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
        </svg>
    </button>
</div>
